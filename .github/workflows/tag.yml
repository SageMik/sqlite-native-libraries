name: 打 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: echo "version=$(grep -oP '"version":\s*"\K[^"]+' sqlite3_native_library/oh-package.json5)" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 是否已存在
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q "v${{ steps.version.outputs.version }}"; then
            echo "::error::tag v${{ steps.version.outputs.version }} 已存在，无法重复打 tag"
            exit 1
          fi

      - name: 创建并推送 tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
